name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ---------------------------------------------------------------------------
  # Build & test matrix: release + debug-instrumented on all three platforms
  # ---------------------------------------------------------------------------
  build-test:
    name: ${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.config }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        compiler: [ default ]
        config: [ release, debug ]
        include:
          - os: ubuntu-latest
            compiler: gcc
            config: release
          - os: ubuntu-latest
            compiler: clang
            config: release
          - os: ubuntu-latest
            compiler: clang
            config: debug

    steps:
      - uses: actions/checkout@v4

      - name: Configure (Linux, ${{ matrix.compiler }})
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
                -DFASTALLOC_BUILD_TESTS=ON \
                -DFASTALLOC_DEBUG=${{ matrix.config == 'debug' && 'ON' || 'OFF' }}
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            cmake -B build -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          fi

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release `
                -DFASTALLOC_BUILD_TESTS=ON `
                -DFASTALLOC_DEBUG=${{ matrix.config == 'debug' && 'ON' || 'OFF' }}

      - name: Build
        run: cmake --build build --config Release -j

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

  # ---------------------------------------------------------------------------
  # Sanitizer jobs (Linux only; MSVC ASan runs in the windows debug job)
  # ---------------------------------------------------------------------------
  sanitizers:
    name: sanitizer-${{ matrix.sanitizer }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [ address-undefined, thread ]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          SAN=""
          case "${{ matrix.sanitizer }}" in
            address-undefined) SAN="address,undefined" ;;
            thread)            SAN="thread" ;;
          esac
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                -DFASTALLOC_BUILD_TESTS=ON \
                -DFASTALLOC_SANITIZE="$SAN"

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          TSAN_OPTIONS: halt_on_error=1
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1

  # ---------------------------------------------------------------------------
  # LSan-specific job (leak detection on the full suite)
  # ---------------------------------------------------------------------------
  leaks:
    name: leak-sanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DFASTALLOC_SANITIZE=leak
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1

  # ---------------------------------------------------------------------------
  # Benchmarks: build only (running them in CI produces noise-dominated data)
  # ---------------------------------------------------------------------------
  benchmarks:
    name: benchmarks-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DFASTALLOC_BUILD_BENCHMARKS=ON -DFASTALLOC_BUILD_TESTS=OFF
      - name: Build
        run: cmake --build build -j
      - name: Smoke-run memory benchmark
        run: ./build/fast_alloc_bench_memory --threads 2 --allocs 2000 --size 256
