name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      # Full-strength cross-allocator verdict run (bench-verdict job). Off by
      # default: the quick preset is the ~2 min smoke, full is a long,
      # shared-runner-noisy sweep whose numbers are informational.
      full:
        description: 'Run the full bench_compare.py sweep (reps=5, threads 1,2,4)'
        type: boolean
        required: false
        default: false

jobs:
  # ---------------------------------------------------------------------------
  # Build & run ALL unit tests: release + debug-instrumented, Linux + Windows.
  # The single gtest binary (fast_alloc_tests) registers every test case via
  # ctest, so "Test" below runs the full suite (~69 cases Release / ~80 with
  # FASTALLOC_DEBUG=ON) on every platform/compiler combination.
  # ---------------------------------------------------------------------------
  build-test:
    name: ${{ matrix.os }}-${{ matrix.compiler || 'default' }}-${{ matrix.config }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        compiler: [ default ]
        config: [ release, debug ]
        include:
          - os: ubuntu-latest
            compiler: gcc
            config: release
          - os: ubuntu-latest
            compiler: clang
            config: release
          - os: ubuntu-latest
            compiler: clang
            config: debug

    steps:
      - uses: actions/checkout@v4

      - name: Configure (Linux, ${{ matrix.compiler }})
        if: runner.os == 'Linux'
        run: |
          CC=gcc CXX=g++
          if [ "${{ matrix.compiler }}" = "clang" ]; then CC=clang CXX=clang++; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_COMPILER=$CC -DCMAKE_CXX_COMPILER=$CXX \
                -DFASTALLOC_BUILD_TESTS=ON \
                -DFASTALLOC_DEBUG=${{ matrix.config == 'debug' && 'ON' || 'OFF' }}

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release `
                -DFASTALLOC_BUILD_TESTS=ON `
                -DFASTALLOC_DEBUG=${{ matrix.config == 'debug' && 'ON' || 'OFF' }}

      - name: Build
        run: cmake --build build --config Release -j

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

  # ---------------------------------------------------------------------------
  # MSVC AddressSanitizer (Linux sanitizers live in the jobs below; MSVC has
  # no TSan/LSan, so Windows gets an ASan-only job).
  #
  # ASan runs in the RELEASE config: MSVC ASan on top of a Debug build
  # (/Od, no inlining, _ITERATOR_DEBUG_LEVEL=2) is pathologically slow —
  # the full suite blew past ctest's default 1500 s timeout on the runner
  # without completing, while the same suite passes the non-ASan Debug
  # build-test job in normal time. Release keeps every ASan shadow check
  # on the allocator + test code; the debug battery (incl. 11 death tests)
  # remains covered by build-test's debug matrix entry. An explicit
  # --timeout 1800 gives Release+ASan generous headroom over the observed
  # ~minutes runtime.
  #
  # v12 (Sep 2026): the v11 push failed this job with ctest stuck at
  # "Start 1: fast_alloc_validate_tests" and NO test output. The v11 suite
  # is clean under Linux ASan (full suite + 64k thread-teardown cycles, 0
  # errors), and the v11 guards are value-only checks ordered before every
  # dereference. The failure class that matches a previously-green job
  # turning red with zero output is OPERATIONAL: /fsanitize=address + /MD
  # makes the exe import clang_rt.asan_dynamic-x86_64.dll from the MSVC
  # toolset; if the runner's PATH does not resolve it after an image
  # refresh (windows-latest rolls new MSVC toolset versions), the process
  # dies at launch (0xC0000135) and ctest shows a bare failure with no
  # output. v12 closes every silent class by construction:
  #   1. The CMake build copies the ASan DLL next to the exe (self-
  #      contained load, PATH-independent).
  #   2. The staging step below re-verifies the DLL, puts the MSVC-bundled
  #      llvm-symbolizer on PATH (any ASan report prints a full symbolized
  #      stack in the job log), and echoes the toolset paths for provenance.
  #   3. ctest runs -V: gtest output streams live, so a hang shows the last
  #      [ RUN ] line instead of 30 minutes of silence.
  #   4. On failure, a bounded post-mortem rerun under cdb (Windows SDK
  #      debugger, abort_on_error so ASan deaths are catchable) prints the
  #      last event + stack - the Windows analog of the ubuntu gdb rerun.
  #   5. A green suite is repeated up to 3x (ctest --repeat until-fails:3)
  #      so a transient/image-drift failure cannot pass as green; a
  #      deterministic failure still stops at the first occurrence.
  # ---------------------------------------------------------------------------
  windows-asan:
    name: windows-msvc-asan
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release `
                -DFASTALLOC_BUILD_TESTS=ON `
                -DFASTALLOC_SANITIZE=address
      - name: Build
        # BOTH gtest binaries: ctest runs every registered test, and the
        # audit suite (fast_alloc_audit_tests) is registered too — building
        # only fast_alloc_tests would leave it "Not Run" and fail the job.
        run: cmake --build build --config Release -j --target fast_alloc_tests fast_alloc_audit_tests
      - name: Stage MSVC ASan runtime + symbolizer (v12)
        shell: pwsh
        run: |
          # Belt-and-braces for the build-time DLL staging (CMake copies
          # clang_rt.asan_dynamic-x86_64.dll next to the exe): re-locate it
          # via vswhere and copy it into build\Release again if needed, so
          # the loader resolves it from the exe dir regardless of PATH.
          # Also put the MSVC-bundled llvm-symbolizer on PATH so any ASan
          # report is fully symbolized in the job log.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot  = & $vswhere -latest -products * `
                        -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
                        -property installationPath
          Write-Host "VS installation: $vsRoot"
          $dll = Get-ChildItem -Path "$vsRoot\VC\Tools\MSVC" -Recurse `
                        -Filter clang_rt.asan_dynamic-x86_64.dll `
                        -ErrorAction SilentlyContinue |
                 Where-Object { $_.FullName -match 'Hostx64\\x64' } |
                 Select-Object -First 1
          if ($dll) {
            Copy-Item $dll.FullName build\Release -Force
            Write-Host "staged ASan runtime: $($dll.FullName)"
          } else {
            Write-Host "WARN: clang_rt.asan_dynamic-x86_64.dll not found under $vsRoot\VC\Tools\MSVC"
          }
          $llvm = Join-Path $vsRoot 'VC\Tools\Llvm\x64\bin'
          if (Test-Path (Join-Path $llvm 'llvm-symbolizer.exe')) {
            Add-Content $env:GITHUB_ENV "PATH=$llvm;$env:PATH"
            Write-Host "llvm-symbolizer on PATH: $llvm"
          } else {
            Write-Host "llvm-symbolizer not found at $llvm (reports will show raw addresses)"
          }
      - name: Test
        # -V streams gtest output live (a hang shows the last [ RUN ] line);
        # --repeat until-fail:3 requires three consecutive green runs of the
        # suite so a transient/image-drift failure is not waved through as
        # green, while a deterministic failure still stops at the first one.
        run: ctest --test-dir build --build-config Release --output-on-failure -V --repeat until-fail:3 --timeout 1800
        env:
          # allocator_may_return_null=1: the differential tests probe libc's
          # "overflow fails cleanly" contract; sanitizer runtimes must behave
          # libc-compatible instead of aborting (also default via
          # tests/sanitizer_defaults.cpp -- env wins per-flag, keep in sync).
          ASAN_OPTIONS: halt_on_error=1:allocator_may_return_null=1
      - name: Post-mortem rerun under cdb (failure only)
        if: failure()
        shell: pwsh
        run: |
          # Windows analog of the ubuntu gdb rerun. Runs the suite under the
          # Windows SDK debugger with abort_on_error=1 so an ASan death is a
          # catchable second-chance exception (__fastfail); cdb then prints
          # the last event and the stack. Bounded at 15 minutes (a rerun of a
          # hanging test would otherwise hang the step too).
          $cdb = "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe"
          if (-not (Test-Path $cdb)) {
            Write-Host "cdb.exe not found on this image - skipping post-mortem"
            exit 0
          }
          $env:ASAN_OPTIONS = "halt_on_error=1:abort_on_error=1:symbolize=1:allocator_may_return_null=1"
          $out = Join-Path $env:RUNNER_TEMP "cdb-rerun.txt"
          $exe = Join-Path $PWD "build\Release\fast_alloc_tests.exe"
          $p = Start-Process -FilePath $cdb -PassThru -NoNewWindow `
                -RedirectStandardOutput $out `
                -ArgumentList '-g','-G','-lines','-c','g; .lastevent; k 50; q', "$exe"
          # WaitForExit(ms) returns $true iff the process exited on its own.
          if (-not $p.WaitForExit(900000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Write-Host "cdb rerun exceeded 15 minutes (the failure reproduces as a hang); killed"
          }
          if (Test-Path $out) { Get-Content $out | Select-Object -Last 80 }

  # ---------------------------------------------------------------------------
  # Sanitizer jobs (Linux only; MSVC ASan runs in the windows-asan job above)
  # ---------------------------------------------------------------------------
  sanitizers:
    name: sanitizer-${{ matrix.sanitizer }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [ address-undefined, thread ]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          SAN=""
          case "${{ matrix.sanitizer }}" in
            address-undefined) SAN="address,undefined" ;;
            thread)            SAN="thread" ;;
          esac
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                -DFASTALLOC_BUILD_TESTS=ON \
                -DFASTALLOC_SANITIZE="$SAN"

      - name: Build
        run: cmake --build build -j

      - name: Test
        # TSan leg only: wrap the whole ctest invocation in `setarch -R`
        # (personality ADDR_NO_RANDOMIZE, inherited by the test binaries).
        #
        # RunKit scripts/03_sanitizers.sh + RUNBOOK §10: libtsan runtimes from
        # GCC<=13 / clang<=17 die BEFORE main() with
        #   "FATAL: ThreadSanitizer: unexpected memory mapping"
        # on kernels with vm.mmap_rnd_bits > 28 — which is the
        # Ubuntu 24.04-era default that ubuntu-latest ships. That is a
        # toolchain/kernel incompatibility, NOT a FastAlloc defect (the same
        # binaries are clean under ASan/UBSan/LSan on the same runner), and
        # which processes lose the ASLR lottery differs per boot — so this
        # leg is latently flaky, failing at random rather than deterministically.
        #
        # `setarch -R` is per-process, needs no root, and is harmless for
        # modern libtsan runtimes (GCC>=14 / clang>=18 tolerate any layout),
        # so the guard costs nothing when it is not needed. The system-wide
        # alternative (sudo sysctl -w vm.mmap_rnd_bits=28) is deliberately NOT
        # used here: mutating runner kernel state would leak into the other
        # jobs sharing the VM.
        run: |
          if [ "${{ matrix.sanitizer }}" = "thread" ] && command -v setarch >/dev/null 2>&1; then
            echo "TSan leg: running under 'setarch $(uname -m) -R' (per-process ASLR off)."
            setarch "$(uname -m)" -R ctest --test-dir build --output-on-failure
          else
            ctest --test-dir build --output-on-failure
          fi
        env:
          # allocator_may_return_null=1: sanitizer allocator in libc-compatible
          # mode for the differential overflow probes (mirrored as a compiled-in
          # default in tests/sanitizer_defaults.cpp; env wins per-flag).
          TSAN_OPTIONS: halt_on_error=1:allocator_may_return_null=1
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:allocator_may_return_null=1
          UBSAN_OPTIONS: halt_on_error=1

  # ---------------------------------------------------------------------------
  # LSan-specific job (leak detection on the full suite)
  # ---------------------------------------------------------------------------
  leaks:
    name: leak-sanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DFASTALLOC_SANITIZE=leak
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          # allocator_may_return_null=1: libc-compatible overflow failures for
          # the differential probes (also compiled-in via
          # tests/sanitizer_defaults.cpp; env wins per-flag).
          ASAN_OPTIONS: detect_leaks=1:allocator_may_return_null=1

  # ---------------------------------------------------------------------------
  # Windows VirtualAlloc/VirtualFree semantics, emulated on Linux.
  #
  # The page cache SPLITS cached spans and frees interior sub-spans. On
  # Windows a blind VirtualFree(ptr, 0, MEM_RELEASE) there either failed
  # silently (interior address -> leak) or released the WHOLE reservation,
  # wiping still-cached split tails -> 0xC0000005 on the windows runners.
  # Fixed with a reservation registry (see src/os_memory.cpp) and reproduced
  # deterministically with -DFASTALLOC_WINVA_EMULATION, which runs the same
  # registry code on Linux (mmap/mprotect/munmap standing in for the
  # Virtual* calls, decommitted pages become PROT_NONE tripwires). This job
  # keeps that whole class of Windows-only lifetime bug caught on plain
  # Linux hardware, in release AND debug configs.
  # ---------------------------------------------------------------------------
  windows-va-emulation:
    name: windows-va-emulation-${{ matrix.config }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config: [ release, debug ]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DFASTALLOC_BUILD_TESTS=ON
          -DFASTALLOC_DEBUG=${{ matrix.config == 'debug' && 'ON' || 'OFF' }}
          -DCMAKE_CXX_FLAGS="-DFASTALLOC_WINVA_EMULATION"

      - name: Build
        # Both gtest binaries — ctest runs every registered test (see
        # windows-asan note): the audit suite must be built too.
        run: cmake --build build -j --target fast_alloc_tests fast_alloc_audit_tests

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # ---------------------------------------------------------------------------
  # Fuzzing (audit §8): the fuzz/ harness family — shared byte-program ISA
  # (8 op classes) + shadow model, invariants checked after EVERY op.
  #
  #   1. fast_alloc_fuzz_standalone, release semantics — deterministic seed,
  #      120 s budget, exit 0 + "FUZZ-CLEAN" = no invariant violations.
  #   2. fast_alloc_fuzz_standalone, FASTALLOC_DEBUG semantics — canaries,
  #      exact-size registry, poison and leak machinery active WHILE
  #      fuzzing (the debug build is the one that found nothing but proved
  #      the F1 fix holds under random programs).
  #   3. libFuzzer campaign — clang, -fsanitize=fuzzer,address,undefined,
  #      persistent allocator state across inputs; mirrors the audit's
  #      build_fuzz.sh (480 s campaign: 36 794 units, 76 exec/s, 0 ASan/
  #      UBSan/LSan errors). CI budget: 300 s + corpus + crash artifacts
  #      uploaded on every run.
  # ---------------------------------------------------------------------------
  fuzzing:
    name: fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Configure (release semantics + fuzz harnesses)
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DFASTALLOC_BUILD_TESTS=ON
          -DFASTALLOC_BUILD_FUZZ=ON

      - name: Build fuzz harness (standalone)
        run: cmake --build build -j --target fast_alloc_fuzz_standalone

      - name: Smoke campaign via ctest (20 s, seed pinned)
        run: ctest --test-dir build --output-on-failure -R fast_alloc_fuzz_smoke

      - name: Standalone campaign — release semantics (120 s)
        run: |
          set -o pipefail
          ./build/fast_alloc_fuzz_standalone 120 20260930 2>&1 | tee fuzz-standalone-release.log
          grep -q "FUZZ-CLEAN" fuzz-standalone-release.log

      - name: Configure (FASTALLOC_DEBUG semantics + fuzz harnesses)
        run: >
          cmake -S . -B build-dbg -DCMAKE_BUILD_TYPE=Release
          -DFASTALLOC_BUILD_TESTS=OFF
          -DFASTALLOC_BUILD_FUZZ=ON
          -DFASTALLOC_DEBUG=ON

      - name: Build fuzz harness (standalone, debug semantics)
        run: cmake --build build-dbg -j --target fast_alloc_fuzz_standalone

      - name: Standalone campaign — debug semantics (120 s)
        run: |
          set -o pipefail
          ./build-dbg/fast_alloc_fuzz_standalone 120 20260931 2>&1 | tee fuzz-standalone-debug.log
          grep -q "FUZZ-CLEAN" fuzz-standalone-debug.log

      - name: libFuzzer campaign (clang, fuzzer+address+undefined, 300 s)
        run: |
          # Identical flag set to audit-scripts/build_fuzz.sh, which produced
          # the audit's 480 s campaign (0 sanitizer findings). The library
          # sources are compiled INTO the harness so ASan/UBSan instrument
          # the allocator itself.
          LIBS="src/fast_alloc.cpp src/slab.cpp src/global_heap.cpp src/tls_cache.cpp src/os_memory.cpp src/debug_aid.cpp"
          mkdir -p fuzz-artifacts corpus
          clang++ -g -O1 -std=gnu++17 -fsanitize=fuzzer,address,undefined \
            -fno-omit-frame-pointer -Iinclude -Isrc -pthread \
            fuzz/fuzz_ops_libfuzzer.cpp $LIBS -o fuzz_ops_libfuzzer
          ASAN_OPTIONS=abort_on_error=1:detect_leaks=1:allocator_may_return_null=1 \
          UBSAN_OPTIONS=halt_on_error=1 \
          ./fuzz_ops_libfuzzer -max_total_time=300 -rss_limit_mb=4096 \
            -print_final_stats=1 -artifact_prefix=fuzz-artifacts/ corpus/ \
            2>&1 | tee fuzz-libfuzzer-campaign.log
          # A crash/leak exits non-zero (fails this step). Belt-and-braces:
          # no sanitizer error lines may be present in the log either.
          ! grep -q -E "ERROR: (AddressSanitizer|LeakSanitizer)|runtime error:" fuzz-libfuzzer-campaign.log

      - name: Upload fuzz campaign logs + crash artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-campaign-logs
          path: |
            fuzz-standalone-release.log
            fuzz-standalone-debug.log
            fuzz-libfuzzer-campaign.log
            fuzz-artifacts/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Global new/delete override (FASTALLOC_OVERRIDE_NEW=ON) — the "route my
  # whole app through FastAlloc" feature (README + RunKit RUNBOOK §7.2).
  #
  # This leg exists because of RunKit audit finding OVR-1 (RUNBOOK §9): with the
  # override on, the build ABORTED ON THE FIRST ALLOCATION with
  # __gnu_cxx::recursive_init_error. Three singletons bootstrap via `new`
  # (GlobalHeap, CachePool, SpanPool); under the override that `new` forwards
  # to fast_malloc, which needs the very singleton being constructed ->
  # re-entrant magic-static init -> terminate. The feature the README
  # advertised was unusable at runtime, and NOTHING in this workflow would
  # have caught it: no other job compiles with -DFASTALLOC_OVERRIDE_NEW.
  #
  # The test is therefore a standalone binary rather than the gtest suite:
  # 01_build.sh deliberately builds ONLY the library in the override tree (the
  # gtest binaries are meaningless there — the whole process heap is already
  # routed through the allocator under test), exactly as the RunKit's
  # 02_test_correctness.sh documents.
  #
  # It checks BOTH halves of the RunKit patch:
  #   OVR-1 — the binary must run to completion (no recursive_init_error),
  #            i.e. the placement-new bootstrap fix is present.
  #   STAT-1 — after freeing everything, current_live_blocks must return to 0.
  #            Without the CountSmallFree() fix in fast_free_sized(), the
  #            counter grows monotonically under sized deletes, so this
  #            assertion is the regression test for the stats bug.
  #
  # Runs on both Linux and Windows: the override replaces the global operators
  # on every platform, and MSVC's UCRT has its own allocation internals.
  # ---------------------------------------------------------------------------
  override-new:
    name: override-new-delete-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v4

      - name: Configure (FASTALLOC_OVERRIDE_NEW=ON)
        shell: bash
        run: >
          cmake -S . -B build-override -DCMAKE_BUILD_TYPE=Release
          -DFASTALLOC_OVERRIDE_NEW=ON
          -DFASTALLOC_BUILD_TESTS=OFF
          -DFASTALLOC_BUILD_BENCHMARKS=OFF

      - name: Build override library
        shell: bash
        run: cmake --build build-override --config Release -j --target fast_alloc

      # The probe is generated inline: the RunKit's own examples/ live outside
      # this repository (FastAlloc-RunKit/ is not versioned here), so CI cannot
      # depend on them. This is the minimal OVR-1/STAT-1 equivalent of
      # RunKit examples/02_new_delete_override.cpp, kept dependency-free.
      - name: Write override probe
        shell: bash
        run: |
          cat > override_probe.cpp <<'EOF'
          // Global new/delete override probe (RunKit OVR-1 / STAT-1).
          // With FAST_ALLOC_OVERRIDE_NEW defined, every operator new/delete in
          // this TU routes through FastAlloc, so reaching the end of main()
          // proves the singleton bootstrap no longer re-enters itself.
          #include "fast_alloc.h"
          #include <cstdio>
          #include <string>
          #include <vector>

          int main() {
              // Everything that stays live MUST be inside its own scope, so it
              // is destroyed BEFORE the stats snapshot below — otherwise the
              // still-in-scope containers legitimately show as live blocks.
              {
                  // Sized delete path (operator delete(void*, size_t)) — the
                  // exact path STAT-1 failed to count.
                  std::vector<int> v(1024, 7);
                  std::string s(4096, 'x');
                  v.push_back(static_cast<int>(s.size()));

                  // Many alloc/free cycles so an uncounted sized free
                  // accumulates into a visibly non-zero live-block count.
                  for (int i = 0; i < 20000; ++i) {
                      std::string tmp(64, static_cast<char>('a' + (i % 26)));
                      if (tmp.empty()) return 2;
                  }
                  { std::vector<char> big(1 << 16, 1); big[0] = 2; }
              } // <- all of the above freed here, via sized delete

              auto st = FastAlloc::fast_alloc_stats();
              std::printf("override probe: small_allocs=%zu small_frees=%zu "
                          "current_live_blocks=%zu current_live_bytes=%zu\n",
                          st.small_allocs, st.small_frees,
                          st.current_live_blocks, st.current_live_bytes);

              // STAT-1 regression gate: fast_free_sized() must count its free,
              // so the live count returns to zero instead of growing with
              // every sized delete.
              if (st.current_live_blocks != 0) {
                  std::printf("FAIL: expected current_live_blocks == 0 after "
                              "freeing everything (STAT-1 regression?)\n");
                  return 1;
              }
              if (st.small_allocs == 0) {
                  std::printf("FAIL: override did not route any allocation "
                              "through FastAlloc\n");
                  return 1;
              }
              if (st.small_frees < st.small_allocs) {
                  std::printf("FAIL: small_frees=%zu < small_allocs=%zu (sized "
                              "frees uncounted? STAT-1 regression?)\n",
                              st.small_frees, st.small_allocs);
                  return 1;
              }
              std::printf("override probe OK (bootstrap + stats)\n");
              return 0;
          }
          EOF

      - name: Build + run override probe (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # FAST_ALLOC_OVERRIDE_NEW is what makes this TU's operators forward
          # to FastAlloc; the library itself is already compiled with it.
          g++ -std=c++17 -O2 -DFAST_ALLOC_OVERRIDE_NEW -Iinclude \
              override_probe.cpp build-override/libfast_alloc.a -pthread -o override_probe
          # A recursive_init_error abort exits 134 (SIGABRT) rather than 1, so
          # print the status explicitly either way.
          set +e
          ./override_probe
          rc=$?
          set -e
          echo "override probe exit=$rc"
          [ $rc -eq 0 ] || exit $rc

      - name: Build + run override probe (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          rem The MSVC-built fast_alloc.lib exports MSVC-mangled C++ symbols
          rem (?fast_alloc_stats@FastAlloc@@...). MinGW g++ cannot resolve
          rem them (GCC mangles the same call _ZN8FastAlloc16fast_alloc_statsEv
          rem - a different C++ ABI), so the probe is compiled with the SAME
          rem MSVC toolchain that built the library: vswhere locates the VS
          rem install, vcvarsall sets up cl/link, exactly like the DLL
          rem staging step in the windows-asan job above.
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%i"
          call "%VSPATH%\VC\Auxiliary\Build\vcvarsall.bat" x64
          cl /nologo /std:c++17 /O2 /EHsc /DFAST_ALLOC_OVERRIDE_NEW /Iinclude override_probe.cpp /Fe:override_probe.exe /link /LIBPATH:build-override\Release fast_alloc.lib
          if errorlevel 1 exit /b 1
          override_probe.exe
          set RC=%ERRORLEVEL%
          echo override probe exit=%RC%
          if %RC% NEQ 0 exit /b %RC%

  # ---------------------------------------------------------------------------
  # Memory-footprint proof (RunKit scripts/06_memory_footprint.sh, RUNBOOK §5).
  #
  # This is the allocator's HEADLINE claim and nothing in this workflow
  # measured it: after freeing 1M objects + fast_alloc_purge(), FastAlloc
  # retains ~16 MB vs glibc 46.7 / jemalloc 171.8 / mimalloc 552.2 MB.
  #
  # Mechanically it is `bench_suite --workload overhead` (1M x 512B objects),
  # which is the ONLY workload that populates retained_after_free_mb /
  # retained_after_purge_mb — every other workload records -1 placeholders
  # (RunKit finding RK-2, where the script wrongly used `--workload ramp` and
  # the columns silently never filled in). The benchmarks job above does run
  # the overhead workload, but only as a throughput/checksum row: it passes
  # --ops 30000, writes no --json, and reads no retention field, so the
  # footprint claim is never actually observed.
  #
  # One allocator per process, JSONL per allocator, and the JSONL is deleted
  # before each thread count because bench_suite opens --json in APPEND mode
  # (RunKit RK-2b: without the rm, the t=4 table re-reads the t=1 rows).
  #
  # Deliberately NOT a pass/fail gate. Absolute retention is kernel-, page-
  # size- and noisy-neighbour-dependent, and the RunKit itself says the RATIO
  # is the point and "your numbers WILL differ". Asserting a hard MB threshold
  # on a shared runner would manufacture flaky red builds. The numbers are
  # measured, printed and archived so a regression is visible in the diff of
  # successive runs; the job fails only if the measurement itself breaks.
  # ---------------------------------------------------------------------------
  memory-footprint:
    name: memory-footprint
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install comparison allocators
        run: |
          sudo apt-get update || (sleep 10 && sudo apt-get update)
          sudo apt-get install -y libjemalloc2 libmimalloc2.0-dev \
            || (sleep 10 && sudo apt-get install -y libjemalloc2 libmimalloc2.0-dev)
          # mimalloc is optional: locate it, and let the loop below skip the
          # leg when the .so is absent (RunKit treats it as best-effort).
          MI=$(ls /usr/lib/x86_64-linux-gnu/libmimalloc.so.2* 2>/dev/null | head -1 || true)
          echo "MIMALLOC_SO=$MI" >> "$GITHUB_ENV"
          [ -n "$MI" ] && echo "mimalloc: $MI" || echo "mimalloc: not found (leg skipped)"

      - name: Configure (Release)
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DFASTALLOC_BUILD_TESTS=OFF
          -DFASTALLOC_BUILD_BENCHMARKS=ON

      - name: Build bench_suite
        run: cmake --build build -j --target bench_suite

      - name: Measure retention (1M x 512B objects, then free-all, then purge)
        run: |
          set -euo pipefail
          MI="${MIMALLOC_SO:-}"
          JEM=""
          for so in /usr/lib/x86_64-linux-gnu/libjemalloc.so.2 /lib/x86_64-linux-gnu/libjemalloc.so.2; do
            [ -z "$JEM" ] && [ -f "$so" ] && JEM="$so"
          done
          for t in 1 4; do
            echo "--- threads=$t ---"
            # APPEND-mode guard (RunKit RK-2b): clear before every thread count.
            rm -f mem_fast.jsonl mem_glibc.jsonl mem_jem.jsonl mem_mi.jsonl
            ./build/bench_suite --alloc fast --label FastAlloc --workload overhead \
              --threads "$t" --reps 1 --json mem_fast.jsonl >/dev/null
            ./build/bench_suite --alloc std  --label glibc     --workload overhead \
              --threads "$t" --reps 1 --json mem_glibc.jsonl >/dev/null
            [ -n "$JEM" ] && LD_PRELOAD="$JEM" ./build/bench_suite --alloc std \
              --label jemalloc --workload overhead --threads "$t" --reps 1 \
              --json mem_jem.jsonl >/dev/null
            [ -n "$MI" ]  && LD_PRELOAD="$MI"  ./build/bench_suite --alloc std \
              --label mimalloc --workload overhead --threads "$t" --reps 1 \
              --json mem_mi.jsonl >/dev/null
            python3 - mem_fast.jsonl mem_glibc.jsonl mem_jem.jsonl mem_mi.jsonl <<'PY'
          import json, sys
          rows = []
          for f in sys.argv[1:]:
              try:
                  with open(f) as fh:
                      for line in fh:
                          d = json.loads(line)
                          r = d["reps"][0]
                          rows.append((d["label"], r["rss_peak_mb"],
                                       r.get("retained_after_free_mb", -1),
                                       r.get("retained_after_purge_mb", -1)))
              except FileNotFoundError:
                  pass
          if not rows:
              raise SystemExit("no retention rows produced — the measurement broke")
          # The headline claim is only observable if the retention columns were
          # actually filled in. -1 everywhere means the workload was wrong
          # (RunKit RK-2), so fail loudly instead of printing a -1 table.
          if all(af < 0 and ap < 0 for _, _, af, ap in rows):
              raise SystemExit(
                  "retained_after_*_mb all -1: the 'overhead' workload did not "
                  "populate them (RunKit RK-2) — claim unmeasured")
          print(f"  {'allocator':<10}{'peak RSS MB':>14}{'after free MB':>16}{'after purge MB':>18}")
          for label, peak, af, ap in rows:
              print(f"  {label:<10}{peak:>14.1f}{af:>16.1f}{ap:>18.1f}")
          # Report the ratio the claim is actually about (lower is better).
          by = {l: (af, ap) for l, _, af, ap in rows}
          if "FastAlloc" in by and "glibc" in by:
              fp, gp = by["FastAlloc"][1], by["glibc"][1]
              if fp > 0 and gp > 0:
                  print(f"  -> after-purge ratio FastAlloc:glibc = 1:{gp/fp:.1f} "
                        f"(RunKit measured ~1:2.9 on its 2-vCPU VM; the RATIO is "
                        f"the claim, absolute MB are machine-specific)")
          PY
          done

      - name: Side-by-side stress (time + peak RSS), std::malloc vs FastAlloc
        run: |
          cmake --build build -j --target fast_alloc_bench_memory
          # 100k allocs x 512B, matching RUNBOOK §5's closing command.
          ./build/fast_alloc_bench_memory --threads 4 --allocs 100000 --size 512

      - name: Upload retention results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-footprint
          path: |
            mem_fast.jsonl
            mem_glibc.jsonl
            mem_jem.jsonl
            mem_mi.jsonl
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Cross-allocator comparison with a win/loss VERDICT (RunKit RUNBOOK §4.4,
  # benchmarks/benchsuite/bench_compare.py).
  #
  # The benchmark-matrix job below already runs run_matrix.sh + analyze.py over
  # the cross-allocator workloads, but it produces raw rows and a summary; it
  # never runs bench_compare.py, which is the RunKit's one-command driver that
  # additionally sweeps the google-benchmark micro suites, emits
  # bench_report.md / bench_report_data.json, and renders an explicit
  # win/loss/loss verdict table per cell.
  #
  # --quick is the ~2-minute smoke preset (reps=3, ops_scale=0.2, threads 1,2).
  # The full run is a workflow_dispatch input, because at full scale this is a
  # long, shared-runner-noisy job whose numbers are informational.
  # ---------------------------------------------------------------------------
  bench-verdict:
    name: bench-verdict-${{ inputs.full || 'quick' }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install comparison allocators
        run: |
          sudo apt-get update || (sleep 10 && sudo apt-get update)
          sudo apt-get install -y libjemalloc2 libmimalloc2.0-dev \
            || (sleep 10 && sudo apt-get install -y libjemalloc2 libmimalloc2.0-dev)
          MI=$(ls /usr/lib/x86_64-linux-gnu/libmimalloc.so.2* 2>/dev/null | head -1 || true)
          echo "MIMALLOC_SO=$MI" >> "$GITHUB_ENV"
          echo "JEMALLOC_SO=/usr/lib/x86_64-linux-gnu/libjemalloc.so.2" >> "$GITHUB_ENV"

      - name: Configure (Release)
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DFASTALLOC_BUILD_TESTS=OFF
          -DFASTALLOC_BUILD_BENCHMARKS=ON

      # bench_compare.py drives bench_suite AND both google-benchmark binaries,
      # and refuses to run without all of them present.
      - name: Build benchmark binaries
        run: |
          cmake --build build -j --target \
            bench_suite fast_alloc_bench fast_alloc_bench_extended \
            fast_alloc_bench_memory

      - name: Run bench_compare.py
        run: |
          cd benchmarks/benchsuite
          if [ "${{ inputs.full }}" = "true" ]; then
            python3 bench_compare.py --reps 5 --threads 1,2,4
          else
            python3 bench_compare.py --quick
          fi
        # bench_compare.py exits non-zero on a bench_suite checksum failure
        # (rc=42) or a sanitizer error, so a failed cell fails this step.

      - name: Upload verdict report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-verdict-report
          path: |
            benchmarks/benchsuite/bench_report.md
            benchmarks/benchsuite/bench_report_data.json
            benchmarks/benchsuite/compare_results.jsonl
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # EVERY benchmark, on BOTH Linux and Windows, executed (not just built):
  #
  #   1. fast_alloc_bench          — every google-benchmark case (filter '.*')
  #   2. fast_alloc_bench_extended — every google-benchmark case (filter '.*')
  #   3. fast_alloc_bench_memory   — full config sweep: threads {1,2,4}
  #                                  x sizes {64, 256, 4096}
  #   4. bench_suite               — FULL matrix: all 11 workloads
  #                                  x allocators {std, fast}
  #                                  x threads {1, 2, 4}
  #                                  = 66 runs per OS, every one
  #                                  checksum-verified (exit 42 = corruption
  #                                  -> red CI). std = glibc on Linux, UCRT
  #                                  on Windows.
  #
  # Release mode is mandatory (CMAKE_BUILD_TYPE=Release switches on the
  # -O3/-march=native / /Ox/GL-LTCG paths). Op counts are CI-scaled (the full
  # 66-run sweep is ~seconds locally; the checksums exercise every size class,
  # slab, cross-thread queue and realloc path). Cross-allocator timing
  # comparisons live in the benchmark-matrix job below.
  #
  # google-benchmark runs use FIXED iteration counts (--benchmark_min_time=3000x)
  # instead of adaptive time-based mode: v1.8.3's adaptive scheduling has a
  # heap-corruption defect (reproduced locally with zero FastAlloc code linked
  # — a pure google-benchmark v1.8.3 + allocator interplay). Fixed 'Nx' mode
  # provably avoids it and is deterministic across machines.
  #
  # The library is pinned to v1.9.4: the 1.9.x series removed v1.8.3's
  # ThreadManager teardown machinery and its adaptive-mode heap corruption,
  # and is the correct modern pin. ALL multithreaded ->Threads(N)
  # registrations are kept: coverage is never reduced to work around a crash.
  #
  # STATUS (Sep 2026, v11 - CRASH CLASS CLOSED BY CONSTRUCTION): four crash
  # signature generations on the runners, each closed in turn. v8 fixed the
  # batch-walk fault (0x10 = [nullptr+offsetof(next)]). v9 made sub-64KB
  # frees (slot holding 0x10) heal instead of crash. v10 turned the
  # benchmark into a writer trap with a store-time witness. The v10 CI run
  # then produced the CLOSING datapoints (full crashlogs, beyond the 80-line
  # tails): (a) "fast_malloc returned non-canonical 0x10 (i=0)" on the very
  # first allocation, (b) ~3000 per-sweep audit pairs = the audit firing
  # every iteration because the slots re-corrupt during the ALLOC phase
  # (page writable, trap blind) - none were signal faults; the 10x row-time
  # inflation was pure audit cost, (c) the fatal SIGSEGV's gdb register
  # dump: rbx = slots[i] = 0xd90b6085fe368400 - 16-byte aligned, >= 64 KB,
  # NON-CANONICAL - past every v10 check (>= 64 KB only) - and the inlined
  # fast_free loaded block->slab at [ptr-16] in the non-canonical half:
  # #GP -> si_code=SI_KERNEL(128), si_addr=0 ("faulting address (nil)"),
  # 3/3 on the runner, 0/650+ locally (the runner's GCC also emitted the
  # free loop without the alignment test the local build has - codegen
  # differences are real, so guards must not rely on source shape).
  # v11:
  #   1. ONE shared full plausibility predicate, IsPlausibleHeapPtr
  #      (fast_alloc_config.h): >= 64 KB AND < 2^47 AND 16-aligned. Applied
  #      at EVERY dereference/return site: fast_free / fast_free_sized /
  #      fast_realloc entry, the TLS pop guard, the batch-head validation,
  #      the fast_malloc return gates, and every freelist walk in
  #      tls_cache.cpp / global_heap.cpp (pending queues, arena splits,
  #      slab extraction). The #GP class is unreachable in any codegen.
  #   2. DeallocateBlock (push) guard: a wild block pointer can no longer
  #      turn a freelist push into the wild write itself.
  #   3. The benchmark frees ONLY witness-proven pointers (value == the
  #      recorded store-time fast_malloc return); anything else is dropped
  #      with full provenance (slot overwritten vs allocator-returned), so
  #      no forged value can reach the allocator from the bench, and the
  #      freelist-corruption cycle is starved instead of sustained.
  #   4. Multi-shot rate-limited telemetry (first 8 in full detail, then
  #      every 1024th, totals at instance end) - the v10 one-shot design
  #      had already been consumed by the 0x10 event and blinded exactly
  #      the crash datapoint. The audit is capped at 3 per instance (the
  #      per-sweep audit was the 10x row-time inflation).
  #   5. The crash handler now prints si_code with the faulting address and
  #      the faulting RIP, and HEALS write faults inside the registered
  #      trap pages (mprotect RW + retry) with the writer's backtrace - a
  #      free-s-phase writer can no longer kill the run either.
  # The [fastalloc-invariant] channels, the [bench-trap] heal reports and
  # the gdb rerun stay as the independent safety net for any NEW class.
  #
  # Each google-benchmark binary runs its benchmark FAMILIES in separate
  # process invocations (family list discovered via --benchmark_list_tests,
  # so coverage is exactly the '.*' filter). Family isolation means a crash
  # in one family can never silently skip the remaining families — with a
  # single '.*' invocation, a SIGSEGV aborts the whole binary and every
  # later registration is lost. It also names the exact failing family in
  # FAILURES.txt and captures a per-family gdb backtrace, and the final gate
  # step prints those captures into the job log.
  #
  # Every step is marked continue-on-error and records failures into
  # FAILURES.txt; a final gate step turns the job red, so one crash never
  # hides the results of the remaining steps. On Linux any crashing binary
  # is immediately re-run under gdb (ASLR kept ON) to capture the backtrace
  # into crashlogs/, uploaded as an artifact for offline diagnosis.
  #
  # Shared public runners occasionally kill long benchmark processes
  # (memory pressure / noisy neighbors): every crashing run is retried
  # exactly once. A crash that PASSES its retry is recorded in FLAKES.txt
  # (echoed in the log and uploaded, but stays green); a crash that fails
  # the retry too goes to FAILURES.txt and fails the gate.
  # ---------------------------------------------------------------------------
  benchmarks:
    name: benchmarks-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v4

      - name: Install gdb (Linux crash diagnostics)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y || (sleep 10 && sudo apt-get update -y)
          sudo apt-get install -y gdb \
            || (sleep 10 && sudo apt-get install -y gdb)

      - name: Configure (Release)
        shell: bash
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DFASTALLOC_BUILD_TESTS=OFF
          -DFASTALLOC_BUILD_BENCHMARKS=ON

      - name: Build all benchmark targets
        shell: bash
        run: |
          cmake --build build --config Release -j --target \
            fast_alloc_bench fast_alloc_bench_extended \
            fast_alloc_bench_memory bench_suite

      - name: Locate binaries
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            BIN="build/Release"; EXT=".exe"
          else
            BIN="build"; EXT=""
          fi
          echo "BIN=$BIN" >> "$GITHUB_ENV"
          echo "EXT=$EXT" >> "$GITHUB_ENV"
          mkdir -p crashlogs

      # --- google/benchmark binaries: every registered benchmark, executed
      #     family-by-family in separate processes (full '.*' coverage, but a
      #     crash in one family cannot hide or abort the rest). Per family:
      #     run (line-buffered, tee'd to crashlogs so the last COMPLETED case
      #     line + the [bench-crash] handler output identify the exact
      #     crashing case) -> (Linux) gdb rerun with backtrace, registers,
      #     the faulting instruction window, $_siginfo (faulting address) and
      #     the process mappings -> one retry -> FLAKES.txt (transient, stays
      #     green) or FAILURES.txt (gate red). ---
      - name: Run fast_alloc_bench (every benchmark, family-isolated)
        shell: bash
        # v10: bound the step so a hung inferior (or a slow gdb rerun on a
        # busy shared runner) can never eat the whole job budget; the
        # per-family FLAKES/FAILURES classification below still applies.
        timeout-minutes: 10
        continue-on-error: true
        run: |
          set -o pipefail
          FAMS=$("$BIN/fast_alloc_bench$EXT" --benchmark_list_tests=true \
                 | sed 's|/.*||' | uniq)
          echo "fast_alloc_bench families: $FAMS"
          for fam in $FAMS; do
            r1=0
            if [ "$RUNNER_OS" = "Linux" ]; then
              stdbuf -oL "$BIN/fast_alloc_bench$EXT" --benchmark_filter="^${fam}/" \
                --benchmark_min_time=3000x --benchmark_repetitions=1 \
                --benchmark_report_aggregates_only=false \
                2>&1 | tee "crashlogs/fast_alloc_bench_${fam}_raw.txt" || r1=$?
            else
              "$BIN/fast_alloc_bench$EXT" --benchmark_filter="^${fam}/" \
                --benchmark_min_time=3000x --benchmark_repetitions=1 \
                --benchmark_report_aggregates_only=false || r1=$?
            fi
            if [ $r1 -ne 0 ] && [ "$RUNNER_OS" = "Linux" ]; then
              gdb -q -batch \
                -ex 'set disable-randomization off' \
                -ex run \
                -ex 'bt 30' \
                -ex 'info registers' \
                -ex 'x/12i $pc-32' \
                -ex 'p $_siginfo' \
                -ex 'info proc mappings' \
                --args "$BIN/fast_alloc_bench$EXT" --benchmark_filter="^${fam}/" \
                --benchmark_min_time=3000x --benchmark_repetitions=1 \
                --benchmark_report_aggregates_only=false \
                2>&1 | tee "crashlogs/fast_alloc_bench_${fam}_gdb.txt"
            fi
            if [ $r1 -ne 0 ]; then
              # transient runner kill? retry once: pass -> FLAKES, fail -> gate
              sleep 5
              r2=0
              "$BIN/fast_alloc_bench$EXT" --benchmark_filter="^${fam}/" \
                --benchmark_min_time=3000x --benchmark_repetitions=1 \
                --benchmark_report_aggregates_only=false || r2=$?
              if [ $r2 -eq 0 ]; then
                echo "fast_alloc_bench/$fam rc=$r1 -> retry PASS (transient)" | tee -a FLAKES.txt
              else
                echo "fast_alloc_bench/$fam rc=$r2 (failed twice)" | tee -a FAILURES.txt
              fi
            fi
          done

      - name: Run fast_alloc_bench_extended (every benchmark, family-isolated)
        shell: bash
        timeout-minutes: 10
        continue-on-error: true
        run: |
          FAMS=$("$BIN/fast_alloc_bench_extended$EXT" --benchmark_list_tests=true \
                 | sed 's|/.*||' | uniq)
          echo "fast_alloc_bench_extended families: $FAMS"
          for fam in $FAMS; do
            r1=0
            "$BIN/fast_alloc_bench_extended$EXT" --benchmark_filter="^${fam}/" \
              --benchmark_min_time=3000x --benchmark_repetitions=1 \
              --benchmark_report_aggregates_only=false || r1=$?
            if [ $r1 -ne 0 ] && [ "$RUNNER_OS" = "Linux" ]; then
              gdb -q -batch -ex 'set disable-randomization off' -ex run \
                -ex 'bt 30' -ex 'info registers' \
                --args "$BIN/fast_alloc_bench_extended$EXT" --benchmark_filter="^${fam}/" \
                --benchmark_min_time=3000x --benchmark_repetitions=1 \
                --benchmark_report_aggregates_only=false \
                2>&1 | tee "crashlogs/fast_alloc_bench_extended_${fam}_gdb.txt"
            fi
            if [ $r1 -ne 0 ]; then
              sleep 5
              r2=0
              "$BIN/fast_alloc_bench_extended$EXT" --benchmark_filter="^${fam}/" \
                --benchmark_min_time=3000x --benchmark_repetitions=1 \
                --benchmark_report_aggregates_only=false || r2=$?
              if [ $r2 -eq 0 ]; then
                echo "fast_alloc_bench_extended/$fam rc=$r1 -> retry PASS (transient)" | tee -a FLAKES.txt
              else
                echo "fast_alloc_bench_extended/$fam rc=$r2 (failed twice)" | tee -a FAILURES.txt
              fi
            fi
          done

      # --- custom memory benchmark: full threads x sizes sweep ---
      - name: Run fast_alloc_bench_memory (threads 1/2/4 x sizes 64/256/4096)
        shell: bash
        timeout-minutes: 10
        continue-on-error: true
        run: |
          rc=0
          for th in 1 2 4; do
            for sz in 64 256 4096; do
              echo "== bench_memory T=$th size=$sz =="
              r1=0
              "$BIN/fast_alloc_bench_memory$EXT" --threads "$th" \
                --allocs 20000 --size "$sz" || r1=$?
              if [ $r1 -ne 0 ]; then
                sleep 5
                r2=0
                "$BIN/fast_alloc_bench_memory$EXT" --threads "$th" \
                  --allocs 20000 --size "$sz" || r2=$?
                if [ $r2 -eq 0 ]; then
                  echo "bench_memory T=$th size=$sz rc=$r1 -> retry PASS (transient)" | tee -a FLAKES.txt
                else
                  echo "bench_memory T=$th size=$sz rc=$r2 (failed twice)" | tee -a FAILURES.txt
                  rc=$r2
                fi
              fi
            done
          done

      # --- bench_suite: the FULL matrix — every workload, every allocator
      #     path (std AND fast), every thread count (1/2/4). Checksums are
      #     verified on every free; rc=42 fails the step. ---
      - name: Run bench_suite (all 11 workloads x std+fast x threads 1/2/4)
        shell: bash
        timeout-minutes: 15
        continue-on-error: true
        run: |
          run2() {  # run2 <label> <cmd...>: run; retry a crash once; classify
            local label="$1"; shift
            "$@" && return 0
            sleep 5
            "$@" && {
              echo "$label rc=1 -> retry PASS (transient)" | tee -a FLAKES.txt
              return 0
            }
            echo "$label (failed twice)" | tee -a FAILURES.txt
            return 1
          }
          rc=0
          for wl in tiny small-mixed random-1-4096 ramp churn cache-thrash \
                    cross-thread thread-churn large realloc-grow overhead; do
            # 'large' moves 64KB..512KB blocks -> keep its op count lower
            OPS=30000; [ "$wl" = "large" ] && OPS=3000
            for th in 1 2 4; do
              echo "== std $wl T=$th ops=$OPS =="
              run2 "bench_suite std/$wl/T=$th" \
                "$BIN/bench_suite$EXT" --alloc std --label std \
                --workload "$wl" --threads "$th" --ops "$OPS" --reps 1 || rc=$?
              echo "== FastAlloc $wl T=$th ops=$OPS =="
              run2 "bench_suite fast/$wl/T=$th" \
                "$BIN/bench_suite$EXT" --alloc fast --label FastAlloc \
                --workload "$wl" --threads "$th" --ops "$OPS" --reps 1 || rc=$?
            done
          done
          if [ $rc -ne 0 ]; then echo "bench_suite rc=$rc (see FAILURES.txt above)"; fi

      # --- v9/v10: surface HEALED invariant events. The guards above keep the
      #     benchmarks alive when the (Sep-2026) corruption class recurs, so
      #     the event would otherwise only live inside the tee'd crashlog
      #     files. This step greps every capture for the one-shot telemetry
      #     lines and prints them into the job log - a green run with healed
      #     events is visible as such, with full provenance (v10 adds the
      #     store-time witness verdicts and the [fastalloc-audit] dumps). ---
      - name: Surface healed invariant telemetry (v11)
        shell: bash
        run: |
          if ls crashlogs/*.txt >/dev/null 2>&1; then
            if grep -l -E '\[fastalloc-invariant\]|\[bench-guard\]|\[fastalloc-audit\]|\[bench-trap\]' crashlogs/*.txt >/dev/null 2>&1; then
              echo "=== HEALED INVARIANT EVENTS (benchmarks survived; provenance below) ==="
              grep -n -E '\[fastalloc-invariant\]|\[bench-guard\]|\[fastalloc-audit\]|\[bench-trap\]' crashlogs/*.txt | head -80 || true
              echo "--- (truncated to first 80 lines; full logs in the artifact) ---"
            else
              echo "No invariant events: allocator ran clean."
            fi
          else
            echo "No crashlogs captured: allocator ran clean."
          fi

      # --- gate: turn the job red if ANY benchmark failed twice above ---
      - name: Check benchmark results
        shell: bash
        run: |
          if [ -s FLAKES.txt ]; then
            echo "=== TRANSIENT FLAKES (passed the retry; artifact has details) ==="
            cat FLAKES.txt
          fi
          if [ -s FAILURES.txt ]; then
            echo "=== BENCHMARK FAILURES ==="
            cat FAILURES.txt
            # Surface the captured forensics (the in-binary [bench-crash]
            # backtraces and the gdb reruns) directly in the job log so the
            # failure cause is visible without opening the artifact.
            if ls crashlogs/*.txt >/dev/null 2>&1; then
              echo "=== CRASH FORENSICS (last 80 lines per capture) ==="
              for f in crashlogs/*.txt; do
                echo "--- $f ---"
                tail -n 80 "$f" || true
              done
            fi
            exit 1
          fi
          echo "all benchmarks passed"

      - name: Upload crash diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-crash-diagnostics-${{ matrix.os }}
          path: |
            crashlogs/
            FAILURES.txt
            FLAKES.txt
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Cross-allocator matrix (glibc + jemalloc + FastAlloc): the same bench_suite
  # workloads again, but with LD_PRELOAD'd allocators for allocator-vs-allocator
  # comparisons. Runs on every push to main and on manual dispatch (not on PRs,
  # which already run the full std+fast sweep above). mimalloc is auto-skipped
  # unless MIMALLOC_SO points at a prebuilt libmimalloc.so. Results are noise
  # on shared runners — treat them as smoke/regression data, not publishable
  # numbers.
  # ---------------------------------------------------------------------------
  benchmark-matrix:
    name: benchmark-matrix
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install jemalloc
        run: |
          sudo apt-get update || (sleep 10 && sudo apt-get update)
          sudo apt-get install -y libjemalloc2 \
            || (sleep 10 && sudo apt-get install -y libjemalloc2)

      - name: Configure (Release)
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DFASTALLOC_BUILD_TESTS=OFF
          -DFASTALLOC_BUILD_BENCHMARKS=ON

      - name: Build bench_suite
        run: cmake --build build -j --target bench_suite

      - name: Run reduced cross-allocator matrix
        run: |
          cd benchmarks/benchsuite
          BENCH_SUITE="$PWD/../../build/bench_suite" \
            OPS=300000 THREADS="1 2" bash ./run_matrix.sh ci_matrix.jsonl 3
          python3 analyze.py ci_matrix.jsonl | tee ci_matrix_summary.md \
            || echo "analyze.py failed (raw jsonl still uploaded)" \
               | tee -a matrix_failures.txt

      - name: Upload matrix results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-matrix-results
          path: |
            benchmarks/benchsuite/ci_matrix.jsonl
            benchmarks/benchsuite/ci_matrix_summary.md
            benchmarks/benchsuite/matrix_failures.txt
          if-no-files-found: ignore
